<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Deskoros</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="description" content="Create OMR answer sheets, scan them with the camera and check marks.">
<!-- installable app (Android: manifest + service worker; iOS: apple-* tags) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="application-name" content="Deskoros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deskoros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --bg:#faf8f5;--card:#ffffff;--ink:#1f2530;--mut:#6a6e78;--line:#e7e2d9;--line2:#f0ece5;
  --pri:#22405f;--pri-h:#1a3450;--pri-weak:#eef1f5;
  --ok:#2e6b4d;--ok-bg:#eaf3ed;--bad:#a1372f;--bad-bg:#f8ecea;--warn:#85601a;--warn-bg:#f8f1e1;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 var(--sans);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
img,video{max-width:100%}
a{color:var(--pri)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;color:var(--ink);margin:0}
h1{font-size:28px;line-height:1.2;margin-bottom:6px}
h2{font-size:18px;margin-bottom:12px}
.sub{color:var(--mut);margin:0 0 26px;max-width:46em}
.hint{color:var(--mut);font-size:13px;margin-top:6px}
.err{color:var(--bad);margin:10px 0;white-space:pre-wrap;font-size:14px}
.okm{color:var(--ok);margin:10px 0;font-size:14px}
code{background:#f1ede6;padding:1px 5px;border-radius:4px;font-size:12.5px}
.big{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1}

/* app shell */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:26px 14px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-family:"Century Gothic","URW Gothic","URW Gothic L","Avant Garde","Avenir Next",Futura,"Trebuchet MS",sans-serif;font-size:21px;font-weight:700;letter-spacing:.03em;padding:0 10px 2px;color:var(--ink)}
.brandlogo{height:1.45em;width:auto;flex:none}
.brandsub{font-size:12.5px;color:var(--mut);padding:0 10px 24px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;font-size:14.5px;cursor:pointer;color:#3a404b}
.side nav button:hover{background:#f6f3ee}
.side nav button.on{background:var(--pri-weak);color:var(--pri);font-weight:600}
.who{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:13.5px}
.who b{display:block;font-weight:600}.who span{color:var(--mut);font-size:12.5px;text-transform:capitalize}
.who button{margin-top:10px}
.top{display:none}
.main{flex:1;min-width:0;padding:38px 44px 60px;max-width:1120px}

/* cards, tables, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px;margin-bottom:16px}
.card.rc{cursor:pointer;transition:border-color .15s}.card.rc:hover{border-color:#b9b2a4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px;align-items:end}
.grid>div{display:flex;flex-direction:column;justify-content:flex-end}
.grid>div>label{flex:1;display:flex;align-items:flex-end}
label{display:block;font-size:13px;color:#3a404b;margin-bottom:5px;font-weight:600}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid #cfc9bd;border-radius:6px;font-size:14.5px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #c3d0de;border-color:var(--pri)}
textarea{min-height:64px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5}
input[type=checkbox],input[type=radio]{accent-color:var(--pri)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line2);font-size:14px}
th{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#faf8f5}
button.b{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:6px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
button.b:hover{background:var(--pri-h)}
button.b.sec{background:#fff;color:var(--ink);border-color:#cfc9bd}
button.b.sec:hover{background:#faf8f5}
button.b.del{background:#fff;color:var(--bad);border-color:#e3c3bf;padding:4px 10px}
button.b:disabled{opacity:.45;cursor:default}
.pill{font-family:var(--sans);display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.ready{background:var(--ok-bg);color:var(--ok)}.pill.generating{background:var(--warn-bg);color:var(--warn)}.pill.failed{background:var(--bad-bg);color:var(--bad)}
.modalbg{position:fixed;inset:0;background:rgba(31,37,48,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:8px;max-width:460px;width:100%;padding:24px;border:1px solid var(--line)}
.modal h2{margin-bottom:8px}
.demobox{position:relative;width:min(1100px,100%);height:min(calc(100vh - 110px),760px);margin-top:44px;background:#0E1730;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.demobox iframe{width:100%;height:100%;border:0;display:block;border-radius:12px}
.demobox .x{position:absolute;top:-44px;right:0;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
button.b.danger{background:var(--bad);border-color:var(--bad);color:#fff}button.b.danger:hover{background:#862e27}
details.promptbox{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:12px;background:#fcfbf9}
details.promptbox summary{cursor:pointer;font-weight:600;color:var(--pri)}
.reviewbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#fcfbf9}
.swbtn{flex:none;width:52px;height:30px;border-radius:99px;border:0;background:#c5ccd8;position:relative;cursor:pointer}
.swbtn span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.swbtn.on{background:var(--ok)}.swbtn.on span{left:25px}
.qa.flag{border-color:#e6d6b0;background:#fffdf7}
.qa .o.pick{cursor:pointer}.qa .o.pick:hover{border-color:#b9b2a4;background:#faf8f5}
.qtools{display:flex;gap:16px;margin-top:8px;font-size:13px}.qtools a{cursor:pointer;color:var(--pri)}
.notice{background:var(--pri-weak);color:var(--pri);border:1px solid #d3dce7;border-radius:6px;padding:10px 14px;margin-bottom:16px;font-size:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:#e6d6b0}
.notice button{background:none;border:0;color:inherit;cursor:pointer;font-size:18px;line-height:1;padding:0}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border-radius:4px;padding:4px 10px;font-weight:600;font-size:13px;background:#f1ede6;color:#3a404b}
.chip.c{background:var(--ok-bg);color:var(--ok)}.chip.w{background:var(--bad-bg);color:var(--bad)}.chip.b{background:var(--pri-weak);color:var(--pri)}

/* overview numbers */
.figures{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:22px}
.figure{padding:16px 20px;border-left:1px solid var(--line)}.figure:first-child{border-left:0}
.figure .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.figure .l{font-size:12.5px;color:var(--mut);margin-top:2px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead .sub{margin:0}
.lrow{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.lrow:last-child{border-bottom:0}.lrow:hover .lt{color:var(--pri)}
.lt{font-weight:600;font-size:15.5px}

/* student review */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.qa{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;background:#fff}
.qa .qt{font-weight:600;margin-bottom:8px}
.qa .o{padding:6px 10px;border-radius:5px;margin:3px 0;border:1px solid transparent}
.qa .o.ok{background:var(--ok-bg);border-color:#cfe3d6}.qa .o.no{background:var(--bad-bg);border-color:#ecc9c4}
.qa .tag{font-size:12px;font-weight:700;margin-left:8px}
.sheetimg{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.legend span{display:inline-block;margin-right:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.ans div{border:1px solid var(--line);border-radius:6px;padding:6px 10px}
iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:6px;margin-top:12px}

/* public pages: intro + sign in */
.pub{min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1080px;margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px;width:100%}
.pnav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.pnav .brand{padding:0;font-size:21px;flex-direction:column;align-items:center;gap:3px;line-height:1}
.pnav .brandlogo{height:46px}
.pnav .links .b{white-space:nowrap}
@media (max-width:560px){.pnav{flex-wrap:wrap;row-gap:12px}.pnav .brand{font-size:17px}.pnav .brandlogo{height:38px}
  .pnav .links{flex-wrap:wrap;justify-content:flex-end;gap:8px}.pnav .links .b{padding:10px 13px}}
.pnav .links{display:flex;gap:10px;align-items:center}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;padding:76px 0 64px;align-items:center}
.display{font-family:var(--serif);font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-.015em;margin:0 0 20px}
.lead{font-size:18px;line-height:1.6;color:#3d434e;max-width:32em;margin:0 0 30px}
.specimen-l{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.section{padding:48px 0;border-top:1px solid var(--line)}
.section h2{font-size:24px;margin-bottom:26px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.step .n{font-family:var(--serif);font-size:28px;color:var(--pri);line-height:1}
.step h3{font-size:17px;margin:10px 0 6px}.step p{margin:0;color:#4a505b;font-size:14.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.cols h3{font-size:19px;margin-bottom:12px}
.cols ul{margin:0;padding:0;list-style:none}.cols li{padding:9px 0;border-bottom:1px solid var(--line2);color:#3d434e;font-size:15px}
.cols li:last-child{border-bottom:0}
.pfoot{margin-top:auto;border-top:1px solid var(--line);padding-top:22px;padding-bottom:22px;color:var(--mut);font-size:13px}
.authwrap{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.authside{background:#f3efe8;border-right:1px solid var(--line);padding:48px 56px;display:flex;flex-direction:column}
.authside .brand{padding:0;font-size:24px;cursor:pointer}
.authside h1{font-size:32px;margin:auto 0 12px}
.authside p{color:#4a505b;max-width:26em;margin:0 0 auto}
.authmain{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.authbox{width:100%;max-width:380px}
.seg{display:flex;border:1px solid #cfc9bd;border-radius:6px;overflow:hidden;margin-bottom:18px;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:9px;font-size:14px;cursor:pointer;color:#3a404b}
.seg button+button{border-left:1px solid #cfc9bd}
.seg button.on{background:var(--pri);color:#fff;font-weight:600}
.authbox .field{margin-bottom:14px}
.switch{margin-top:16px;font-size:14px;color:var(--mut)}
.switch a{cursor:pointer;font-weight:600}

/* mark card (QR page + intro specimen) */
.mcard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mcard .hd{padding:20px 22px;border-bottom:1px solid var(--line);background:#fcfbf9}
.mcard .hd small{color:var(--mut);font-size:13px}
.mcard .hd .t{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2;margin-top:2px}
.mcard .bd{padding:22px}
.qstrip{display:flex;gap:5px;flex-wrap:wrap;margin-top:16px}
.qstrip div{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px}
.kv{width:100%;margin-top:16px}.kv td{padding:8px 0}.kv td:last-child{text-align:right;font-weight:600}

@media(max-width:900px){.two{grid-template-columns:1fr}.hero{grid-template-columns:1fr;gap:36px;padding:44px 0 40px}.display{font-size:36px}.steps{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr;gap:32px}.authwrap{grid-template-columns:1fr}.authside{display:none}}
@media(max-width:800px){
  body{font-size:15px}
  input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],textarea,select{font-size:16px;padding:11px 12px}
  button.b{min-height:44px;padding:11px 16px}button.b.del{min-height:36px}
  .app{display:block}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  .top .brand{padding:0;font-size:19px}
  .top button.b{min-height:36px;padding:6px 12px}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  .side .brand,.side .brandsub,.side .who{display:none}
  .side nav{flex-direction:row;gap:4px;width:100%}
  .side nav button{flex:1;text-align:center;padding:8px 2px;font-size:12.5px;min-height:46px;line-height:1.2}
  .main{padding:20px 16px calc(96px + env(safe-area-inset-bottom));max-width:none}
  h1{font-size:23px}.big{font-size:28px}
  .card{padding:16px}
  .figures{grid-template-columns:1fr 1fr}.figure:nth-child(3){border-left:0;border-top:1px solid var(--line)}.figure:nth-child(4){border-top:1px solid var(--line)}
  table{display:block;overflow-x:auto;white-space:nowrap;max-width:100%}
  .grid{grid-template-columns:1fr}
  .wrap{padding:0 18px}.pnav{padding:16px 0}.steps{grid-template-columns:1fr}.display{font-size:32px}
  .qa{padding:10px}iframe{height:70vh}
}
/* password with show / hide */
.pwbox{position:relative}
.pwbox input{padding-right:46px}
.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:8px;cursor:pointer;border-radius:6px;display:grid;place-items:center}
.pweye:hover,.pweye:focus-visible{color:var(--ink);background:var(--pri-weak)}
/* loading feedback */
.toploader{position:fixed;left:0;right:0;top:0;height:3px;z-index:100;overflow:hidden;background:rgba(34,64,95,.12)}
.toploader::before{content:"";position:absolute;top:0;bottom:0;width:40%;background:var(--pri);border-radius:3px;animation:toploader 1s ease-in-out infinite}
@keyframes toploader{0%{left:-40%}100%{left:100%}}
.loadbox{display:flex;align-items:center;gap:10px;color:var(--mut);padding:28px 4px;font-size:15px}
/* teacher batch progress */
.batch{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff}
.bstep{display:flex;gap:12px;align-items:flex-start;padding:7px 0;color:var(--mut);position:relative}
.bstep:not(.last)::after{content:"";position:absolute;left:10px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.bstep.done::after{background:#86c5a2}
.bstep>div{flex:1;min-width:0}
.bdot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;z-index:1}
.bstep.done{color:var(--ink,#1f2937)}.bstep.done .bdot{background:var(--ok);border-color:var(--ok);color:#fff}
.bstep.now{color:var(--ink,#1f2937)}.bstep.now .bdot{border-color:var(--pri);border-top-color:transparent;animation:bspin .8s linear infinite}
.bstep.now .blabel{font-weight:700}
.blabel{line-height:22px}
.bar{height:8px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--pri);border-radius:99px;transition:width .4s ease}
.bpage{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.bpage .chip{background:#f3f4f6;color:#9aa0a8;font-weight:500}
.bpage .chip.cdone{background:#e6f4ec;color:var(--ok)}
.bpage .chip.cnow{background:#e8eefb;color:var(--pri);font-weight:700;animation:bpulse 1.2s ease-in-out infinite}
.bnote{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:8px;animation:bpop .35s ease-out}
.bdone{display:flex;gap:12px;align-items:center;background:#ecf7f0;border:1px solid #b7e0c6;border-radius:10px;padding:12px 14px;margin-bottom:10px;animation:bpop .45s ease-out}
.bcheck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700}
@keyframes bspin{to{transform:rotate(360deg)}}
@keyframes bpulse{50%{opacity:.55}}
@keyframes bpop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.bpill{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(15,23,42,.18);max-width:calc(100vw - 32px);animation:bpop .3s ease-out}
.bpill.ok{border-color:#b7e0c6;background:#ecf7f0}.bpill.lost{border-color:#f0c2bd}
.bpill-main{position:relative;display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px 14px;text-align:left;font-size:13px;cursor:pointer;overflow:hidden;border-radius:12px;color:inherit}
.bpill-main i{position:absolute;left:0;bottom:0;height:3px;background:var(--pri);transition:width .4s}
.bpill-x{border:0;background:none;font-size:18px;padding:0 12px;cursor:pointer;color:var(--mut)}
.spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--pri);border-top-color:transparent;animation:bspin .8s linear infinite}
@media (max-width:700px){.bpill{bottom:72px}}
/* camera: a photo was taken */
@keyframes shotflash{from{opacity:.8}to{opacity:0}}
@keyframes shotfly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}25%{transform:translate(-50%,-50%) scale(1.04);opacity:1}
  100%{transform:translate(calc(-50% - 26vw),calc(-50% + 44vh)) scale(.1);opacity:.4}}
@keyframes shotbump{0%{transform:scale(1)}40%{transform:scale(1.18);background:#16a34a}100%{transform:scale(1)}}
@keyframes shottoast{0%{opacity:0;transform:translate(-50%,8px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

  let deferred = null; const subs = new Set();

    available: () => !standalone() && (!!deferred || ios()),
    ios: () => ios() && !deferred,
    prompt: async () => { if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; emit(); },
    subscribe: f => { subs.add(f); return () => subs.delete(f); },

const EXAMPLE = `What is the capital of France?
A) Berlin
B) Paris
C) Rome
D) Madrid
Answer: B

Which data structure is LIFO?
A) Queue
B) Stack
C) Array
D) Graph
Answer: B`;

/* Mirrors the server parser (app/textconv.py): blank line between questions, options A) B) C) D), "Answer: X" line. */
const ANSWER_LINE = /^[ \t]*[*_]*(?:answer|ans|correct(?:[ \t]+answer)?|key)[*_]*[ \t]*[:=\-][ \t]*[*_]*\(?([A-Da-d])(?![A-Za-z])[^\n]*$/gim;
const NUM_PREFIX = /^\s*(?:q(?:uestion)?[ \t]*)?\d+[ \t]*[.):][ \t]+/i;
const CONTINUATION = /^\s*(?:\*?\(?[Aa][.)][ \t]|[*_]*(?:answer|ans|correct|key)[*_]*[ \t]*[:=\-])/i;

function parseBlock(t) {
  const marks = [...t.matchAll(/(?<!\S)(\*?)\(?([A-Da-d])[.)]\s+/g)];
  for (let i = 0; i < marks.length; i++) {
    if (marks[i][2].toUpperCase() !== "A") continue;
    const chain = [marks[i]]; let want = 1;
    for (const m of marks.slice(i + 1)) if (m[2].toUpperCase() === "ABCD"[want] && chain.push(m) && ++want === 4) break;
    if (chain.length === 4) {
      const question = t.slice(0, chain[0].index).trim();
      if (!question) throw new Error("write the question before the options");
      const opts = chain.map((m, k) => t.slice(m.index + m[0].length, k < 3 ? chain[k + 1].index : t.length).trim().replace(/\s+/g, " "));
      if (opts.some(o => !o)) throw new Error("an option is empty");
      const starred = chain.map((m, k) => m[1] ? k : -1).filter(k => k >= 0);
      return {question, options: opts, starred: starred.length === 1 ? starred[0] : null};
    }
  }
  throw new Error("could not find options A) B) C) D) in this order after the question");
}

function parseBulk(text) {
  const blocks = [];
  for (let raw of text.replace(/\*\*/g, "").replace(/\r\n/g, "\n").trim().split(/\n\s*\n/)) {
    raw = raw.trim();
    if (!raw) continue;
    if (blocks.length && CONTINUATION.test(raw)) blocks[blocks.length - 1] += "\n" + raw; else blocks.push(raw);
  }
  const questions = [], errors = [];
  blocks.forEach((block, i) => {
    try {
      const answers = [...block.matchAll(ANSWER_LINE)].map(m => m[1]);
      const p = parseBlock(block.replace(NUM_PREFIX, "").replace(ANSWER_LINE, "").trim());
      if (answers.length > 1) throw new Error("more than one Answer line");
      const correct = answers.length ? "ABCD".indexOf(answers[0].toUpperCase()) : p.starred;
      if (correct === null || correct < 0) throw new Error("no correct answer (add a line like 'Answer: B')");
      questions.push({question: p.question, options: p.options, correct});
    } catch (e) { errors.push("Question " + (i + 1) + ' ("' + block.replace(/\s+/g, " ").slice(0, 40) + '..."): ' + e.message); }
  });
  return {questions, errors};
}

function QrGate({token}) {
  const [user, setUser] = useState(undefined), [mode, setMode] = useState("login"), [entry, setEntry] = useState(null);
  useEffect(() => { api("/api/me").then(r => r.json()).then(setUser).catch(() => setUser(null)); }, []);
  useEffect(() => {
    if (!user) return;
    api("/api/qr/" + token).then(r => r.json()).then(q => {
      if (q.role === "teacher") setEntry(q.status === "ok" ? {view: {name: "detail", id: q.exam_id, result: q.result_id}}
        : {view: {name: "detail", id: q.exam_id}, notice: "This sheet has not been checked yet - there is no preview. Scan it from here, then open it again."});
      else if (q.status === "ok") setEntry({open: q.result_id});
      else setEntry({notice: q.status === "not_released" ? "No preview yet: your teacher has not released the marks for this exam." : "No preview: this sheet has not been checked yet."});
    }).catch(e => setEntry({notice: e.message, warn: true}));
    history.replaceState(null, "", "/");
  }, [user && user.id]);
  const logout = async () => { Batches.clear(); await api("/api/logout", {method: "POST"}); setUser(null); setEntry(null); };
  if (user === undefined) return null;
  if (!user) return h(AuthPage, {mode, onUser: setUser, notice: "Log in to see the result for this sheet.",
    go: t => t === "" ? (location.href = "/") : setMode(t === "#signup" ? "register" : "login")});
  if (!entry) return null;
  return user.role === "teacher" ? h(Teacher, {user, onLogout: logout, entry}) : h(Student, {user, setUser, onLogout: logout, entry});
}

function App() {
  const qr = location.pathname.match(/^\/r\/([A-Za-z0-9]+)$/);
  if (qr) return h(QrGate, {token: qr[1]});
  const [user, setUser] = useState(undefined), [hash, setHash] = useState(location.hash);
  useEffect(() => { api("/api/me").then(r => r.json()).then(setUser).catch(() => setUser(null)); }, []);
  useEffect(() => { const f = () => setHash(location.hash); window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  const go = target => { location.hash = target; window.scrollTo(0, 0); };
  const logout = async () => { Batches.clear(); await api("/api/logout", {method: "POST"}); setUser(null); location.hash = ""; };
  if (user === undefined) return null;
  if (!user) return hash === "#login" || hash === "#signup" ? h(AuthPage, {mode: hash === "#signup" ? "register" : "login", onUser: setUser, go}) : h(Landing, {go});
  return user.role === "teacher" ? h(Teacher, {user, onLogout: logout}) : h(Student, {user, setUser, onLogout: logout});
}
